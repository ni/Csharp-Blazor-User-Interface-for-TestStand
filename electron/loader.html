<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>TestStand WebOI</title>
    <link href="./electron-app.css" rel="stylesheet" />
    <script src="./all-components-bundle.min.js"></script>
</head>
<body>
    <nimble-theme-provider theme="dark" lang="en-us" dir="ltr">
        <div class="container">
            <nimble-spinner aria-label="spinner"
                            style="height: var(--ni-nimble-spinner-medium-height); margin-bottom: 50px; margin-right: 10px;"
                            appearance="accent"
                            role="progressbar">
            </nimble-spinner>
        </div>
    </nimble-theme-provider>
</body>
</html>
